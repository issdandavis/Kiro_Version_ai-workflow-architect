name: AI Agent Runner

on:
  workflow_call:
    inputs:
      agent_type:
        required: false
        type: string
        default: code-reviewer
      target_path:
        required: false
        type: string
        default: .
      model:
        required: false
        type: string
        default: gpt-4
  workflow_dispatch:
    inputs:
      agent_type:
        description: Type of AI agent to run
        required: true
        type: choice
        options:
          - code-reviewer
          - test-generator
          - documentation-writer
          - bug-fixer
          - performance-optimizer
      target_path:
        description: Target file or directory path
        required: true
        type: string
      model:
        description: AI model to use
        required: false
        default: gpt-4
        type: choice
        options:
          - gpt-4
          - gpt-4-turbo
          - claude-3-opus
          - gemini-pro
  repository_dispatch:
    types: [ai-agent-trigger]
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write
  pull-requests: write

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install AI agent dependencies
        run: |
          pip install openai anthropic google-generativeai
          pip install langchain langchain-openai

      - name: Resolve runtime inputs
        id: resolve
        run: |
          echo "agent_type=${{ inputs.agent_type || github.event.inputs.agent_type || github.event.client_payload.agent_type || 'code-reviewer' }}" >> $GITHUB_OUTPUT
          echo "target_path=${{ inputs.target_path || github.event.inputs.target_path || github.event.client_payload.target_path || '.' }}" >> $GITHUB_OUTPUT
          echo "model=${{ inputs.model || github.event.inputs.model || github.event.client_payload.model || 'gpt-4' }}" >> $GITHUB_OUTPUT

      - name: Run resolved AI agent
        run: |
          python scripts/ai-agents/runner.py \
            --agent-type "${{ steps.resolve.outputs.agent_type }}" \
            --target "${{ steps.resolve.outputs.target_path }}" \
            --model "${{ steps.resolve.outputs.model }}" \
            --output-format json

      - name: Create Pull Request with Agent Changes
        if: success() && github.event_name != 'schedule' && vars.ALLOW_ACTIONS_PR == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "AI Agent: ${{ steps.resolve.outputs.agent_type }} updates"
          title: "[AI Agent] ${{ steps.resolve.outputs.agent_type }} - Automated Improvements"
          body: |
            ## AI Agent Report

            **Agent Type:** ${{ steps.resolve.outputs.agent_type }}
            **Model Used:** ${{ steps.resolve.outputs.model }}
            **Target Path:** ${{ steps.resolve.outputs.target_path }}

            This PR was automatically generated by the AI Agent Runner workflow.
          branch: ai-agent/${{ steps.resolve.outputs.agent_type }}-${{ github.run_number }}
          delete-branch: true

      - name: Upload agent logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-agent-logs-${{ github.run_number }}
          path: logs/ai-agents/

      - name: Notify on failure
        if: failure()
        run: |
          echo "AI Agent run failed. Check logs for details."

  scheduled-maintenance:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run all maintenance agents
        run: |
          echo "Running scheduled AI agent maintenance..."
