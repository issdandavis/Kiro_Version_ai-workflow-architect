name: Main App CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:
    inputs:
      action:
        required: false
        type: string
        default: run

env:
  NODE_VERSION: '20.x'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Execute requested action
        run: |
          ACTION="${{ inputs.action || 'run' }}"
          case "$ACTION" in
            test)
              npm test
              ;;
            build|deploy|run)
              npm run build
              ;;
            *)
              echo "Unknown action '$ACTION'. Defaulting to build."
              npm run build
              ;;
          esac
      
      - name: Success
        run: echo "Workflow completed successfully!"
